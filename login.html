<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Henry Watch Login</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0b0b;
    font-family:Arial,sans-serif;
    color:white;
}

.login-box{
    width:320px;
    background:#151515;
    padding:30px;
    border-radius:15px;
    text-align:center;
    border:1px solid #d4af37;
}

h2{
    color:#d4af37;
}

input{
    width:90%;
    padding:12px;
    margin:10px;
    border-radius:8px;
    border:none;
}

button{
    width:95%;
    padding:12px;
    background:#d4af37;
    border:none;
    border-radius:25px;
    font-weight:bold;
    cursor:pointer;
}

#error{
    color:red;
    margin-top:10px;
}
</style>

</head>

<body>

<div class="login-box">

<h2>Henry Watch</h2>

<p>Private Access</p>

<input type="email" id="email" placeholder="Email">

<input type="password" id="password" placeholder="Password">

<button onclick="login()">Login</button>

<p id="error"></p>

</div>


<script type="module">

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getAuth, signInWithEmailAndPassword } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSy...",
  authDomain: "henrywatchh.firebaseapp.com",
  projectId: "henrywatchh",
  storageBucket: "henrywatchh.firebasestorage.app",
  messagingSenderId: "760902891311",
  appId: "1:760902891311:web:..."
};
};


const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


window.login = function(){

let email=document.getElementById("email").value;
let password=document.getElementById("password").value;


signInWithEmailAndPassword(auth,email,password)

.then(()=>{
    window.location.href="dashboard.html";
})

.catch((error)=>{
    document.getElementById("error").innerHTML=
    "Login failed";
});

}

</script>

</body>
</html>
