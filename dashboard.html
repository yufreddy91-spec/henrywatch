<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Henry Watch Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
<h1>Henry Watch Dashboard</h1>
</header>

<div class="container">
<h2>Welcome!</h2>
<p>Login successful.</p>
<hr>

<h2>WhatsApp Watch Tracker</h2>

<input type="file" id="chatFile" accept=".txt">

<br><br>

<button onclick="loadChat()">Import WhatsApp Chat</button>

<br><br>

<table border="1" width="100%">
<thead>
<tr>
<th>Dealer</th>
<th>Watch</th>
<th>Price</th>
</tr>
</thead>
<tbody id="watchTable">
</tbody>
</table>

<script src="script.js"></script>

<h3>Added WhatsApp Chat</h3>

<input type="file" id="chatFile" accept=".zip,.txt">

<br><br>

<button id="dealerChatBtn">
    Add WhatsApp Chat
</button>

<p id="status"></p>
<a href="index.html">
<button>Go to Home</button>
</a>
</div>
<script>
document.getElementById("dealerChatBtn").onclick = function () {
    const file = document.getElementById("chatFile").files[0];

    if (!file) {
        alert("Please select a WhatsApp chat file.");
        return;
    }

    document.getElementById("status").innerHTML =
        "✅ " + file.name + " selected successfully.";
};
</script>
</body>
</html>
